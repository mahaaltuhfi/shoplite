# Secret: the MongoDB connection string (kept out of the code)
apiVersion: v1
kind: Secret
metadata:
  name: product-secrets
  namespace: shoplite
type: Opaque
stringData:
  MONGO_URL: mongodb://product-db:27017/products
---
# Storage so products are not lost when the database pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-db-data
  namespace: shoplite
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# The MongoDB database for products
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
  namespace: shoplite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-db-data
---
# A fixed name "product-db" so the service can find the database
apiVersion: v1
kind: Service
metadata:
  name: product-db
  namespace: shoplite
spec:
  selector:
    app: product-db
  ports:
    - port: 27017
---
# Saheedat's Product Service (2 copies)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef: { name: product-secrets, key: MONGO_URL }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 15
---
# Open the Product Service on your laptop at port 30002
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shoplite
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30002
