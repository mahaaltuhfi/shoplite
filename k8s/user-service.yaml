# Secret: the passwords (kept out of the code)
apiVersion: v1
kind: Secret
metadata:
  name: user-secrets
  namespace: shoplite
type: Opaque
stringData:
  DB_USER: shoplite
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-to-a-long-random-string-32-chars-min
  DATABASE_URL: postgresql+psycopg2://shoplite:change-me@user-db:5432/users
---
# The PostgreSQL database for users
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: shoplite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: users
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: user-secrets, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: user-secrets, key: DB_PASSWORD }
---
# A fixed name "user-db" so the service can find the database
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: shoplite
spec:
  selector:
    app: user-db
  ports:
    - port: 5432
---
# Maha's User Service (2 copies)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: user-secrets, key: DATABASE_URL }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: user-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 15
---
# Open the User Service on your laptop at port 30001
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shoplite
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001